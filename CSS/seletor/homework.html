<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="/CSS/seletor/homework.css">
<body>

    <form class="login">
        <img class="img" src="https://i.pinimg.com/1200x/56/41/32/564132650627f7386ea54581cbc389f1.jpg" alt="">
        <p class="header">Welcome back!</p>
        <p class="tittle">Sign in to access your guided meditations, 
            daily practices, and personal journey
        </p>

        <label for="">Enter Email</label><br>
        <input class="input" type="email" placeholder="Email">
        <br><br>

        <label for="">Enter Password</label><br>
        <input class="input" type="password" placeholder="Password">
        <br><br>

        <input type="checkbox" checked>
        <span class="remember">Remember me?</span>
        <br>

        <button class="btn_login">Login</button>

        <p class="or">or</p>

        <button class="google">
            <svg width="6%" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16">
            <path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"/>
            </svg>
            Login with Google
        </button>

    </form>

</body>
</html>
